[package]
name = "keyforge_core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "keyforge-shield open core: reference Ed25519 license token verification, C ABI"

[lib]
name = "keyforge_core"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "issue-demo-token"
path = "src/bin/issue.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hex = "0.4"

[profile.release]
panic = "abort"
lto = true
strip = true
